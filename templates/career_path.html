{% extends "base.html" %}
{% block title %}你的未来 · 职业发展网络{% endblock %}
{% block body_class %}career-page-body{% endblock %}

{% block head %}
  <link rel="stylesheet" href="/static/css/career_path.css?v=20260906a">
{% endblock %}

{% block body %}
<div id="career-root" class="career-root" data-state-url="/api/career-path/state"
     data-questions-url="/api/career-path/questions"
     data-answers-url="/api/career-path/answers">

  <!-- 顶部细条：返回 + 专业/毕业摘要 -->
  <header class="career-topbar" id="career-topbar" hidden>
    <a class="career-topbar__back" href="/dashboard">← 返回首页</a>
    <div class="career-topbar__meta" id="career-topbar-meta"></div>
    <a class="career-topbar__back" href="/resume">简历工作台</a>
    <button type="button" class="career-topbar__redo" id="career-redo" hidden>重新测试</button>
  </header>

  <!-- 主舞台：时间轴 SVG 网络图 + 详情/知识卡片 -->
  <main class="career-stage" id="career-stage" hidden>
    <div class="career-view-tools" id="career-view-tools" role="group" aria-label="职业方向视图">
      <button type="button" data-career-view="list" aria-pressed="true">方向列表</button>
      <button type="button" data-career-view="network" aria-pressed="false">网络图</button>
      <label><span class="career-sr-only">搜索职业方向</span><input id="career-search" type="search" placeholder="搜索方向、技能" maxlength="100"></label>
      <button type="button" id="career-preferences">职业偏好</button>
      <button type="button" id="career-job-postings">真实在招职位</button>
      <label><span class="career-sr-only">筛选方向</span><select id="career-direction-filter"><option value="all">全部方向</option><option value="saved">已收藏</option><option value="dismissed">暂不考虑</option></select></label>
    </div>
    <div class="career-directions" id="career-directions" aria-label="职业方向列表"></div>
    <div class="career-scroll" id="career-scroll">
      <div id="career-canvas" class="career-canvas"></div>
    </div>

    <!-- 顶部专属欢迎/定位条 -->
    <div class="career-banner" id="career-banner" hidden></div>

    <!-- 图例 -->
    <div class="career-legend" id="career-legend"></div>

    <!-- 节点详情卡片（点击节点后出现，点空白处关闭） -->
    <aside class="career-detail" id="career-detail" hidden></aside>

    <!-- 未毕业阶段：必备知识卡片面板（点击未毕业节点后出现） -->
    <section class="career-prep" id="career-prep" hidden></section>
  </main>
  <section id="career-task-status" class="career-task-status" aria-label="职业推荐处理状态" aria-live="polite" hidden></section>

  <!-- 节点悬停浮窗 -->
  <div id="career-tip"></div>

  <!-- 欢迎 + 测试 浮窗（首次） -->
  <div class="career-intro" id="career-intro" hidden>
    <div class="career-intro__inner">
      <div class="career-typewriter" id="career-typewriter" aria-live="polite"></div>
      <div class="career-quiz" id="career-quiz" hidden></div>
    </div>
  </div>

  <!-- 初始加载 -->
  <div class="career-boot" id="career-boot">
    <div class="career-boot__spark" aria-hidden="true"></div>
    <p>正在连接你的职业星图…</p>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/career_tools_client.js?v=20260906a"></script>
<script src="/static/js/career_path_network.js?v=20260906a"></script>
<script src="/static/js/career_path_app.js?v=20260906a"></script>
{% endblock %}
