{% extends "base.html" %}
{% block title %}学习文档编辑器 · LanShare{% endblock %}
{% block css %}<link rel="stylesheet" href="{{ asset_url('css/lessondoc_editor.css') }}">{% endblock %}
{% block body_class %}lde-page{% endblock %}
{% block body %}
<main id="lessondoc-editor" class="lde-app" aria-label="学习文档编辑器">
    <header class="lde-topbar">
        <a href="{{ editor_config.returnUrl }}" class="lde-back" aria-label="返回材料库">←</a>
        <div class="lde-heading"><span class="lde-eyebrow">学习文档</span><h1 id="lde-title">正在加载…</h1></div>
        <select id="lde-document" aria-label="切换首页或课次"><option value="0">课程首页</option>{% for item in editor_config.lessons %}<option value="{{ item.n }}">第 {{ item.n }} 课 · {{ item.title }}</option>{% endfor %}</select>
        <span id="lde-save-state" class="lde-save-state" role="status" aria-live="polite">连接中</span>
        <div class="lde-top-actions"><button type="button" id="lde-undo" class="lde-icon-button" aria-label="撤销" title="撤销 Ctrl+Z">↶</button><button type="button" id="lde-redo" class="lde-icon-button" aria-label="重做" title="重做 Ctrl+Shift+Z">↷</button><button type="button" id="lde-history" class="lde-button">历史</button><button type="button" id="lde-preview" class="lde-button">预览当前修改</button><button type="button" id="lde-save" class="lde-button lde-primary">保存</button></div>
    </header>
    <div id="lde-error" class="lde-notice lde-error" role="alert" hidden></div>
    <div id="lde-warning" class="lde-notice" role="status" hidden></div>
    <div class="lde-mobile-bar"><button id="lde-toggle-elements" class="lde-button" type="button">元素</button><span>小屏可预览，横屏编辑更舒适</span><button id="lde-toggle-props" class="lde-button" type="button">属性</button></div>
    <div class="lde-workspace">
        <aside class="lde-elements" id="lde-elements" aria-label="元素与图层">
            <div class="lde-panel-heading"><h2>添加元素</h2><button id="lde-templates" class="lde-button" type="button">我的元素</button></div>
            <label class="lde-search"><span class="sr-only">搜索元素</span><input type="search" id="lde-search" placeholder="搜索文字、图表、交互…"></label>
            <div id="lde-palette" class="lde-palette"></div>
            <div class="lde-panel-heading"><h2>本页元素</h2><button type="button" id="lde-source" class="lde-icon-button" aria-label="查看文档 JSON">{ }</button></div><div id="lde-layers" class="lde-layers"></div>
        </aside>
        <section class="lde-center" aria-label="编辑画布">
            <div class="lde-canvas-toolbar"><span id="lde-context">准备画布</span><div id="lde-page-actions" class="lde-inline-actions"></div><label class="lde-zoom">缩放 <select id="lde-zoom" aria-label="画布缩放"><option value="fit">适应</option><option value="0.5">50%</option><option value="0.75">75%</option><option value="1">100%</option></select></label></div>
            <div id="lde-stage" class="lde-stage" tabindex="0" aria-label="画布。使用元素列表选择内容，方向键移动。"><div id="lde-frame-wrap" class="lde-frame-wrap"><iframe id="lde-frame" title="学习文档编辑画布" src="{{ '/materials/lessondoc-editor/' ~ editor_config.packId ~ '/preview?lesson=' ~ editor_config.lessonNo }}" referrerpolicy="same-origin"></iframe></div></div>
            <nav id="lde-pages" class="lde-page-rail" aria-label="页面列表"></nav>
        </section>
        <aside id="lde-props" class="lde-props" aria-label="选中内容的属性"></aside>
    </div>
</main>
<script id="lessondoc-editor-config" type="application/json">{{ editor_config | tojson }}</script>
{% endblock %}
{% block scripts %}<script type="module" src="{{ asset_url('js/lessondoc_editor/index.js') }}"></script>{% endblock %}
