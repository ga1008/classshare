{% extends "resume/layout.html" %}

{% block content %}
<div class="rz-page-head">
    <div>
        <div class="rz-page-head__title">我的简历</div>
        <div class="rz-page-head__sub">预览所见即导出所得；可下载 Word / PDF，或编辑重新生成。</div>
    </div>
    <div class="rz-page-head__actions">
        <button type="button" class="rz-btn" id="rzImportResumeBtn">导入简历</button>
        <a class="rz-btn rz-btn--primary" href="/resume/builder">+ 新建简历</a>
        <input id="rzImportResumeFile" type="file" hidden accept=".doc,.docx,.pdf,.png,.jpg,.jpeg,.webp,.bmp,.gif,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,image/*">
    </div>
</div>

<div id="rzResumes" class="rz-grid"></div>
{% endblock %}

{% block page_script %}
<script src="/static/js/resume_common.js?v=20260629b"></script>
<script src="/static/js/resume_list.js?v=20260701a"></script>
{% endblock %}
