{% extends "resume/layout.html" %}

{% block content %}
<div class="rz-page-head">
    <div>
        <div class="rz-page-head__title">我的简历</div>
        <div class="rz-page-head__sub">预览所见即导出所得；可下载 Word / PDF，或编辑重新生成。</div>
    </div>
    <div class="rz-page-head__actions">
        <button type="button" class="rz-btn" id="rzImportResumeBtn">导入简历</button>
        <a class="rz-btn rz-btn--primary" href="/resume/builder">+ 新建简历</a>
        <input id="rzImportResumeFile" type="file" hidden accept=".doc,.docx,.pdf,.png,.jpg,.jpeg,.webp,.bmp,.gif,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,image/*">
    </div>
</div>

<div id="rzReadiness" class="rz-readiness"></div>
<div id="rzImportDrop" class="rz-import-drop" aria-label="导入简历文件">
    <div class="rz-import-drop__icon" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3v12"></path><path d="m7 8 5-5 5 5"></path><path d="M5 15v3a3 3 0 0 0 3 3h8a3 3 0 0 0 3-3v-3"></path>
        </svg>
    </div>
    <div class="rz-import-drop__copy">
        <strong>把已有简历拖到这里</strong>
        <span>支持 Word / PDF / 图片，解析后由你核对并选择导入内容</span>
    </div>
</div>
<div id="rzResumeFilters" class="rz-filterbar"></div>
<div id="rzResumes" class="rz-grid"></div>
<nav id="rzResumePagination" class="rz-resume-pagination" aria-label="简历分页"></nav>
{% endblock %}

{% block page_script %}
<script src="/static/js/resume_common.js?v=20260906a"></script>
<script src="/static/js/resume_list.js?v=20260906a"></script>
{% endblock %}
