{# Include once in the teacher task area; classroom.id is the teaching offering. #}
<details class="assessment-classification-batch" data-assessment-classification-batch data-class-offering-id="{{ classroom.id }}">
    <summary>核对历史任务分类</summary>
    <div class="assessment-classification-batch__body">
        <p>逐项核对教学用途后选择分类，再保存本页勾选的任务。名称建议仅供参考，已有答案、分数和历史成绩材料保留。</p>
        <p data-classification-batch-status role="status" aria-live="polite">展开后读取当前课堂任务。</p>
        <div class="assessment-classification-batch__scroll" tabindex="0" aria-label="任务分类核对表">
            <table class="assessment-classification-batch__table">
                <thead><tr><th scope="col">选择</th><th scope="col">任务与现有分类</th><th scope="col">确认分类</th><th scope="col">影响</th></tr></thead>
                <tbody data-classification-batch-rows></tbody>
            </table>
        </div>
        <div class="assessment-classification-batch__actions">
            <button type="button" class="btn btn-outline btn-sm" data-classification-batch-previous disabled>上一页</button>
            <button type="button" class="btn btn-outline btn-sm" data-classification-batch-next disabled>下一页</button>
            <button type="button" class="btn btn-outline btn-sm" data-classification-batch-clear disabled>清除勾选</button>
            <button type="button" class="btn btn-primary btn-sm" data-classification-batch-save disabled>保存已核对分类</button>
        </div>
    </div>
</details>
<style>
.assessment-classification-batch { margin-block: 1rem; border: 1px solid var(--border-color, #dbe2ea); border-radius: 14px; background: var(--surface-color, #fff); }
.assessment-classification-batch > summary { padding: .85rem 1rem; cursor: pointer; font-weight: 600; }
.assessment-classification-batch__body { padding: 0 1rem 1rem; }
.assessment-classification-batch__body p { color: var(--text-secondary, #475569); font-size: .9rem; }
.assessment-classification-batch__scroll { overflow-x: auto; }
.assessment-classification-batch__table { width: 100%; border-collapse: collapse; text-align: left; }
.assessment-classification-batch__table th, .assessment-classification-batch__table td { padding: .65rem; border-bottom: 1px solid var(--border-color, #e2e8f0); vertical-align: middle; }
.assessment-classification-batch__table th { font-size: .85rem; color: var(--text-secondary, #475569); }
.assessment-classification-batch__table small { display: block; margin-top: .25rem; color: var(--text-secondary, #64748b); }
.assessment-classification-batch__table select { min-width: 8.5rem; padding: .45rem; border: 1px solid var(--border-color, #cbd5e1); border-radius: 8px; background: var(--surface-color, #fff); color: inherit; }
.assessment-classification-batch__actions { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: 1rem; }
</style>
<script type="module" src="{{ url_for('static', path='js/assessment_classification_batch.js') }}"></script>
