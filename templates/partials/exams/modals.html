{# 试卷页分区 partial（P4 拆分自 manage/exams.html，仅搬移不改逻辑） #}
<div class="modal-overlay" id="materialReverseModal" role="dialog" aria-modal="true" aria-labelledby="materialReverseModalTitle">
    <div class="modal-box exam-reverse-modal">
        <div class="modal-header">
            <h3 class="modal-title" id="materialReverseModalTitle">材料反推</h3>
            <button class="modal-close" type="button" onclick="closeMaterialReverseModal()" aria-label="关闭材料反推窗口">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
            </button>
        </div>
        <div class="modal-body">
            <div class="exam-reverse-field">
                <label for="material-reverse-prompt">额外提示</label>
                <textarea id="material-reverse-prompt" data-prompt-pool-key="exam.material_reverse" maxlength="1200" placeholder="可补充课程性质、考核形式、评分侧重点、特殊扣分规则；留空则严格依据所选试卷反推。"></textarea>
            </div>
            <div class="exam-reverse-list-title" id="materialReverseListTitle">选择试卷</div>
            <div class="exam-reverse-list" id="materialReversePaperList"></div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-outline" type="button" onclick="closeMaterialReverseModal()">取消</button>
            <button class="btn btn-primary" type="button" id="material-reverse-confirm-btn" onclick="confirmMaterialReverse()">确定生成</button>
        </div>
    </div>
</div>

<!-- 分配模态框 -->
<div class="modal-overlay" id="assignModal">
    <div class="modal-box">
        <div class="modal-header">
            <h3 class="modal-title">分配试卷到课堂</h3>
            <button class="modal-close" onclick="closeAssignModal()">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>
        <div class="modal-body">
            <div class="alert alert-info mb-4" style="padding: 1rem; border-radius: 8px; background-color: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; display: flex; gap: 8px;">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 2px;"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
                <div>
                    <strong>试卷:</strong> <span id="assign-exam-name">加载中...</span><br>
                    <span style="font-size: 0.85rem;">试卷被分配到课堂后，将作为该课堂的一个作业任务发给学生。</span>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">选择目标课堂 (可多选)</label>
                <div id="offering-list" style="border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: var(--spacing-3); max-height: 250px; overflow-y: auto; background: var(--bg-color);">
                    <div class="text-center p-3 text-muted">
                        <span class="spinner" style="display:inline-block; width:16px; height:16px; border-width:2px; vertical-align:middle; margin-right:8px;"></span> 加载中...
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label required" for="assign-assessment-kind">本次任务分类</label>
                <select id="assign-assessment-kind" class="form-select">
                    <option value="" selected disabled>请选择分类</option>
                    <option value="homework">平时作业</option>
                    <option value="midterm">期中测验</option>
                    <option value="final">期末测验</option>
                </select>
                <p class="text-xs text-muted mt-1">所选课堂使用同一分类。不同用途请分别分配；不会修改共享试卷。</p>
            </div>
            <div class="form-group">
                <label class="form-label" for="assign-learning-stage-key">试炼阶段</label>
                <select id="assign-learning-stage-key" class="form-select">
                    <option value="">普通考试，不绑定境界试炼</option>
                    {% for stage in learning_stage_options %}
                    <option value="{{ stage.key }}">{{ stage.level_name }} · 通过后点亮至此境界</option>
                    {% endfor %}
                </select>
                <p class="text-xs text-muted mt-1">绑定后，学生该考试批改达到 80 分，会自动获得该阶段及之前缺失的证书。</p>
            </div>

            <div class="form-group">
                <label class="form-label" for="assign-availability-mode">答题时间策略</label>
                <select id="assign-availability-mode" class="form-select">
                    <option value="permanent">长期有效</option>
                    <option value="deadline">截止时间</option>
                    <option value="countdown">倒计时</option>
                </select>
            </div>
            <div class="form-group" id="assign-deadline-group">
                <label class="form-label" for="assign-due-at">截止时间</label>
                <input type="datetime-local" id="assign-due-at" class="form-control" data-dp-pair="#assign-starts-at" data-dp-role="end">
            </div>
            <div id="assign-countdown-group">
                <div class="form-group">
                    <label class="form-label" for="assign-duration-minutes">倒计时（分钟）</label>
                    <input type="number" id="assign-duration-minutes" class="form-control" min="1" step="1" placeholder="例如：90">
                </div>
                <div class="form-group">
                    <label class="form-label" for="assign-starts-at">开始时间（可选）</label>
                    <input type="datetime-local" id="assign-starts-at" class="form-control" data-dp-pair="#assign-due-at" data-dp-role="start">
                    <p class="text-muted text-sm mt-1">留空表示发布后从当前时间开始计时。</p>
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-outline" onclick="closeAssignModal()">取消</button>
            <button class="btn btn-primary" id="confirm-assign-btn" onclick="confirmAssign()">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                确认分配
            </button>
        </div>
    </div>
</div>

<!-- Tag Popover -->
<div class="tag-popover" id="tagPopover">
    <div class="tag-popover-header">
        <span class="tag-popover-title">管理标签</span>
        <button class="tag-popover-close" onclick="closeTagPopover()">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
    </div>
    <div class="tag-popover-body">
        <div class="tag-popover-tags" id="tagPopoverTags">
            <!-- Dynamic tag pills -->
        </div>
        <div class="tag-popover-input-row">
            <input type="text" id="tagPopoverInput" placeholder="输入新标签..." maxlength="10" onkeydown="onTagInputKeydown(event)">
            <button class="tag-popover-add-btn" id="tagPopoverAddBtn" onclick="addTagFromPopover()">添加</button>
        </div>
        <div class="tag-popover-hint">Enter 添加，单个 ≤10 字，最多 20 个</div>
    </div>
</div>

<div class="exam-paper-preview-backdrop" id="paperPreviewModal" role="dialog" aria-modal="true" aria-labelledby="paperPreviewTitle" style="display:none;">
    <div class="exam-paper-preview-dialog" role="document">
        <div class="exam-paper-preview-dialog__header">
            <h3 class="exam-paper-preview-dialog__title" id="paperPreviewTitle">试卷预览</h3>
            <button class="exam-paper-preview-dialog__close" type="button" onclick="closePaperPreview()" aria-label="关闭试卷预览">&times;</button>
        </div>
        <div class="exam-paper-preview-dialog__body">
            <div id="paperPreviewBody">
                <div class="spinner mx-auto"></div>
            </div>
        </div>
    </div>
</div>
