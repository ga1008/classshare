{# 页面背景图层：登录态才渲染，未登录页完全不受影响。
   它固定在视口底部、不随滚动、保持原图比例，颜色与图片只经受控的自定义属性写入。 #}
{% set preferences = ui_palette|default({}) %}
{% set backdrop = preferences.backdrop_scene|default(none) if preferences.enabled|default(false) else none %}
{% if backdrop %}
<div class="lq-page-backdrop" data-lq-page-backdrop aria-hidden="true"
     data-lq-backdrop-mode="{{ backdrop.mode }}"
     data-lq-backdrop-seed="{{ backdrop.seed }}"
     data-lq-backdrop-color="{{ backdrop.color }}"
     data-lq-backdrop-base="{{ backdrop.base }}"
     data-lq-backdrop-manifest="{{ backdrop.manifest }}"
     data-lq-backdrop-image-url="{{ backdrop.image|default('', true) }}"
     data-lq-backdrop-frost-state="{{ 'ready' if backdrop.image else 'off' }}"
     style="--lq-backdrop-color: {{ backdrop.color }}; --lq-backdrop-image: {{ backdrop.image_css }}; --lq-backdrop-paint: {{ backdrop.frost_css }}">
    <div class="lq-page-backdrop__image" data-lq-backdrop-image></div>
    <div class="lq-page-backdrop__veil"></div>
</div>
<script type="application/json" data-lq-backdrop-catalog>{{ backdrop.categories|tojson }}</script>
<script>
    // Prepaint only. The shared scene owner validates the manifest, loads the
    // frost and releases this full-screen cover; it never targets a topbar.
    (() => {
        try {
            const layer = document.querySelector('[data-lq-page-backdrop]');
            const context = document.body.dataset.uiPaletteContext;
            const read = key => { try { return JSON.parse(sessionStorage.getItem(key) || 'null'); } catch (_) { return null; } };
            const valid = value => /^\/static\/img\/life_tips\/[A-Za-z0-9][A-Za-z0-9._-]{0,120}\.(webp|jpg|jpeg|png)$/.test(value || '');
            const handoff = read('lanshareLoginScene');
            const age = Date.now() - Number(handoff?.t || 0);
            const fresh = valid(handoff?.image) && age >= 0 && age < 45000;
            const saved = read('lansharePageScene');
            const scene = fresh ? handoff : saved?.context === context && valid(saved?.image) ? saved : null;
            if (scene && layer.dataset.lqBackdropMode === 'scene') {
                const frost = scene.image.replace('/life_tips/', '/life_tips/frost/').replace(/\.[^.]+$/, '.webp');
                layer.dataset.lqBackdropImageUrl = scene.image;
                layer.style.setProperty('--lq-backdrop-image', `url(${scene.image})`);
                layer.style.setProperty('--lq-backdrop-paint', `url(${frost})`);
            }
            if (fresh) {
                const html = document.documentElement;
                html.style.setProperty('--scene-cover-image', `url(${handoff.image})`);
                html.classList.add('has-scene-cover');
                setTimeout(() => { html.classList.remove('has-scene-cover', 'scene-cover-dissolving'); html.style.removeProperty('--scene-cover-image'); }, 6000);
            }
        } catch (_) { /* Decoration never blocks content. */ }
    })();
</script>
{% endif %}
