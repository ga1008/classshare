{% extends "manage/layout.html" %}
{% block title %}签名审批与使用{% endblock %}
{% block extra_head %}<link rel="stylesheet" href="{{ asset_url('css/material_workflows.css') }}">{% endblock %}
{% block content %}
<section class="msw-page" data-signature-workflows>
  <details class="msw-point" data-start-application><summary>从材料发起签名申请</summary><p class="msw-note">进入材料列表，选择一份或多份同类文档，然后点击右侧“申请签名”。审批人会收到申请时的实际文档。</p><div class="msw-toolbar"><a class="msw-button" href="/manage/archive/academic-grade-registers">成绩登记表</a><a class="msw-button" href="/manage/archive/academic-exam-analyses">试卷分析表</a><a class="msw-button" href="/manage/archive/assessment-plans">考核计划表</a></div></details>
  <p class="msw-note" data-notification-readiness hidden role="status"></p>
  <nav class="msw-tabs" aria-label="签名工作区"><button type="button" data-view="incoming" aria-pressed="true">待我审批</button><button type="button" data-view="outgoing" aria-pressed="false">我的申请</button><button type="button" data-view="usage" aria-pressed="false">使用记录</button></nav>
  <form class="msw-filters" data-filters>
    <label class="msw-search">搜索<input type="search" name="q" placeholder="申请人、课程或材料名称"></label>
    <label>状态<select name="status"><option value="pending">待审批</option><option value="">全部状态</option><option value="approved">已批准</option><option value="partially_used">部分已使用</option><option value="consumed">已使用</option><option value="rejected">已拒绝</option><option value="cancelled">已取消</option></select></label>
    <label>文档类型<select name="document_type"><option value="">全部文档</option><option value="academic_grade_register">成绩登记表</option><option value="academic_exam_analysis">试卷分析表</option><option value="assessment_plan">考核计划表</option></select></label>
    <label>申请类别<select name="request_kind"><option value="">全部申请</option><option value="use">使用签名</option><option value="claim">认领签名</option></select></label>
    <label>申请人类别<select name="requester_role"><option value="">全部账号</option><option value="teacher">教师</option><option value="student">学生</option></select></label>
    <label>任职身份<select name="identity"><option value="">全部身份</option><option value="teacher">教师</option><option value="department_head">系主任</option><option value="vice_department_head">副系主任</option><option value="dean">院长</option><option value="vice_dean">副院长</option><option value="counselor">辅导员</option></select></label>
    <label>所属组织<input name="organization" placeholder="学校、学院或系部"></label>
    <button type="reset" class="msw-button">清除筛选</button>
  </form>
  <div class="msw-toolbar"><label><input type="checkbox" data-select-page>选择本页可审批申请</label><span data-count aria-live="polite"></span><button type="button" class="msw-button msw-primary" data-batch="approve" disabled>批量批准</button><button type="button" class="msw-button" data-batch="reject" disabled>批量拒绝</button><button type="button" class="msw-button" data-refresh>刷新</button></div>
  <div class="msw-status" role="status" data-status></div>
  <details class="msw-point" data-history hidden><summary>最近提交与文档应用结果</summary><div data-history-list></div></details>
  <div class="msw-workspace">
    <div class="msw-request-list" data-list aria-label="签名申请列表"></div>
    <aside class="msw-preview" data-preview><div class="msw-placeholder"><strong>选择一份申请材料</strong><p>选择申请后，可预览材料并处理签名。</p></div></aside>
  </div>
  <footer class="msw-pagination"><button class="msw-button" data-prev>上一页</button><span data-page></span><button class="msw-button" data-next>下一页</button></footer>
</section>
{% endblock %}
{% block scripts %}<script type="module" src="{{ asset_url('js/signature_workflows.js') }}"></script>{% endblock %}
