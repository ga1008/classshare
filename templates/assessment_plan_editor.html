<!DOCTYPE html>
<html lang="zh-CN" data-theme="lanshare">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>编辑考核计划表 · {{ plan.title }}</title>
    {% include "partials/ui_system_assets.html" %}
</head>
<body class="lp-editor-body">
    <header class="lp-editor__header">
        <a class="lp-btn lp-btn--ghost" href="/manage/teaching/assessment-plans">← 返回考核计划表库</a>
        <strong class="lp-editor__title" id="ap-editor-title">{{ plan.title }}</strong>
        <div class="lp-editor__header-actions">
            <span class="lp-editor__save-state is-clean" id="ap-save-state" aria-live="polite">已保存</span>
            <span class="ap-score-pill" id="ap-score-pill">分值合计 —</span>
            <a class="lp-btn lp-btn--ghost" id="ap-open-preview" href="/assessment-plan/{{ plan.id }}/preview" target="_blank" rel="noopener">新窗口预览</a>
            <button type="button" class="lp-btn lp-btn--primary" id="ap-save">保存</button>
        </div>
    </header>

    <main class="lp-editor">
        <section class="lp-editor__form" id="ap-editor-form">
            <details class="lp-editor__cover" open>
                <summary>基础信息</summary>
                <div class="ap-field-grid" id="ap-field-grid"></div>
            </details>

            <details class="lp-editor__cover" open>
                <summary>考核项目（分值合计须为 100）</summary>
                <div class="ap-items" id="ap-items"></div>
                <div class="ap-items__foot">
                    <button type="button" class="lp-btn lp-btn--ghost" id="ap-add-item">+ 添加考核项</button>
                    <span class="ap-items__total" id="ap-items-total"></span>
                </div>
            </details>

            <details class="lp-editor__cover" open>
                <summary>签名</summary>
                <div class="ap-signatures" id="ap-signatures"></div>
                <p class="ap-hint">可绑定本人签名；主任签字可线下手写，或从签名库选择（需授权）。</p>
            </details>

            <details class="lp-editor__cover" id="ap-import-details" hidden>
                <summary>导入详情（每个识别到的细节）</summary>
                <div class="ap-import" id="ap-import"></div>
            </details>
        </section>

        <section class="lp-editor__preview">
            <div class="lp-editor__preview-bar">
                <span>当前保存版预览</span>
                <button type="button" class="lp-btn lp-btn--ghost" id="ap-refresh-preview">保存并刷新预览</button>
                <button type="button" class="lp-btn lp-btn--ghost" id="ap-export-word">导出 Word</button>
                <button type="button" class="lp-btn lp-btn--ghost" id="ap-export-pdf">导出 PDF</button>
            </div>
            <div class="lp-editor__export-gate" id="ap-export-gate" hidden></div>
            <iframe id="ap-preview-frame" class="lp-editor__frame" src="/assessment-plan/{{ plan.id }}/preview" title="考核计划表预览"></iframe>
        </section>
    </main>

    <script id="ap-editor-boot" type="application/json">
    {
        "id": {{ plan['id'] | tojson }},
        "title": {{ plan['title'] | tojson }},
        "fields": {{ plan['fields'] | tojson }},
        "items": {{ plan['items'] | tojson }},
        "notes": {{ plan['notes'] | tojson }},
        "examiner_signature": {{ plan['examiner_signature'] | tojson }},
        "reviewer_signature": {{ plan['reviewer_signature'] | tojson }},
        "import_preview": {{ plan['import_preview'] | tojson }}
    }
    </script>
    <script type="module" src="{{ asset_url('js/auth.js') }}"></script>
    <script type="module" src="{{ asset_url('js/assessment_plan_editor.js') }}"></script>
</body>
</html>
