<!doctype html><html><head><meta charset="utf-8"><title>Pixel contrast fixtures</title>
<style>
body { margin: 20px; font: 20px Arial, sans-serif; background: white; }
p { width: 260px; margin: 0 0 20px; background: white; }
#black { color: black; } #white, #gradient { color: white; }
.gradient { width: max-content; background: linear-gradient(90deg, black, white); }
</style></head><body>
<p><span id="black" data-lq-pixel-text>Black on white</span></p>
<p><span id="white" data-lq-pixel-text>White on white</span></p>
<p class="gradient"><span id="gradient" data-lq-pixel-text>White on gradient</span></p>
</body></html>
