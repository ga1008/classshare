# Included inside the classroom HTTPS server when the isolated game API is enabled.
location ^~ /api/games/v1/ {
    # Access timing logs retain the redacted path and request ID; upstream error text includes raw URIs.
    error_log /dev/null crit;
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 2s;
    set $game_api_upstream http://game-api:8015;
    proxy_pass $game_api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $lq_proxy_host;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 65m;
    proxy_request_buffering off;
    proxy_cache off;
}
