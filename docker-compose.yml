name: lanshare

x-lanshare-service: &lanshare-service
  build:
    context: .
    dockerfile: Dockerfile
    # No package downloads are allowed in an ordinary application build.
    network: none
    args:
      APP_VERSION: ${LANSHARE_TAG:-dev}
      LANSHARE_RUNTIME_BASE: ${LANSHARE_RUNTIME_BASE:-lanshare-runtime-deps:current}
      LANSHARE_FRONTEND_BASE: ${LANSHARE_FRONTEND_BASE:-lanshare-frontend-deps:current}
  image: ${LANSHARE_IMAGE:-lanshare-app}:${LANSHARE_TAG:-latest}
  restart: unless-stopped
  init: true
  # Socket capacity is separate from the bounded DB/thread/AI execution pools.
  ulimits:
    nofile:
      soft: 8192
      hard: 8192
  env_file:
    - ./docker.env
  volumes:
    # Canonical runtime data root. Legacy mounts below keep upgrades safe until
    # `python tools/migrate_data_layout.py --apply --verify` has been run.
    - &lanshare-data ./data:/app/data
    - &lanshare-attendance ./attendance:/app/attendance
    - &lanshare-chat-logs ./chat_logs:/app/chat_logs
    - &lanshare-submissions ./homework_submissions:/app/homework_submissions
    - &lanshare-logs ./logs:/app/logs
    - &lanshare-rosters ./rosters:/app/rosters
    - &lanshare-shared ./shared_files:/app/shared_files
    - &lanshare-storage ./storage:/app/storage
  networks:
    - lanshare

x-lanshare-timezone: &lanshare-timezone
  TZ: ${TZ:-Asia/Shanghai}
  APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Shanghai}

services:
  ai:
    <<: *lanshare-service
    command: ["ai"]
    cpu_shares: ${LANSHARE_AI_CPU_SHARES:-1024}
    environment:
      POSTGRES_APPLICATION_NAME: lanshare-ai
      <<: *lanshare-timezone
      AI_HOST: 0.0.0.0
      AI_PORT: "8001"
      MAIN_APP_CALLBACK_URL: http://app:8000/api/internal/grading-complete
    expose:
      - "8001"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/api/internal/health', timeout=5).status == 200 else 1)
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  app:
    <<: *lanshare-service
    command: ["main"]
    # Relative weight under CPU contention. Compose interpolation reads the
    # shell/project .env; service env_file values do not configure this field.
    cpu_shares: ${LANSHARE_APP_CPU_SHARES:-2048}
    depends_on:
      ai:
        condition: service_healthy
    environment:
      POSTGRES_APPLICATION_NAME: lanshare-app
      <<: *lanshare-timezone
      MAIN_HOST: 0.0.0.0
      MAIN_PORT: "8000"
      MAIN_LIMIT_CONCURRENCY: ${LANSHARE_APP_MAX_CONNECTIONS:-2048}
      AI_ASSISTANT_URL: http://ai:8001
      MAIN_APP_CALLBACK_URL: http://app:8000/api/internal/grading-complete
      # Bound DB fan-out on the shared 2c/4G host. HTTP concurrency is much
      # larger than DB concurrency; requests wait briefly for a pooled slot.
      POSTGRES_POOL_MAX: "12"
      LANSHARE_PUBLISH_STATIC: "1"
    volumes:
      - *lanshare-data
      - *lanshare-attendance
      - *lanshare-chat-logs
      - *lanshare-submissions
      - *lanshare-logs
      - *lanshare-rosters
      - *lanshare-shared
      - *lanshare-storage
      - lanshare-static:/srv/lanshare-static
    # Only the host's narrow Agent gateway uses this loopback listener.
    ports:
      - "127.0.0.1:18000:8000"
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/internal/live', timeout=5).status == 200 else 1)
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  mailer:
    <<: *lanshare-service
    command: ["mailer"]
    cpu_shares: ${LANSHARE_MAILER_CPU_SHARES:-256}
    environment:
      POSTGRES_APPLICATION_NAME: lanshare-mailer
      <<: *lanshare-timezone
      EMAIL_WORKER_ID: mailer-compose
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - from classroom_app.services.email_notification_service import email_worker_health_snapshot; import sys; snapshot=email_worker_health_snapshot(); sys.exit(0 if snapshot.get('ok') else 1)
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  blog-crawler:
    <<: *lanshare-service
    command: ["blog-crawler"]
    cpu_shares: ${LANSHARE_CRAWLER_CPU_SHARES:-128}
    depends_on:
      ai:
        condition: service_healthy
      app:
        condition: service_healthy
    environment:
      POSTGRES_APPLICATION_NAME: lanshare-blog-crawler
      <<: *lanshare-timezone
      BLOG_NEWS_CRAWLER_WORKER_ID: blog-crawler-compose
      BLOG_NEWS_CRAWLER_POLL_SECONDS: "60"
      AI_ASSISTANT_URL: http://ai:8001

  scheduler:
    <<: *lanshare-service
    command: ["scheduler"]
    stop_grace_period: 5m
    cpu_shares: ${LANSHARE_SCHEDULER_CPU_SHARES:-512}
    depends_on:
      app:
        condition: service_healthy
    environment:
      POSTGRES_APPLICATION_NAME: lanshare-scheduler
      <<: *lanshare-timezone
      SCHEDULER_WORKER_ID: scheduler-compose
      # Projection/poll knobs come from shared docker.env, then code defaults.
      # Compose interpolation here would override env_file during deployment.
      AI_ASSISTANT_URL: http://ai:8001
      MAIN_APP_INTERNAL_URL: http://app:8000
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - from classroom_app.services.scheduled_task_service import scheduler_health_snapshot; import sys; snapshot=scheduler_health_snapshot(); sys.exit(0 if snapshot.get('ok') else 1)
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  agent-worker:
    <<: *lanshare-service
    command: ["agent-worker"]
    cpu_shares: ${LANSHARE_AGENT_CPU_SHARES:-512}
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - *lanshare-data
      - *lanshare-attendance
      - *lanshare-chat-logs
      - *lanshare-submissions
      - *lanshare-logs
      - *lanshare-rosters
      - *lanshare-shared
      - *lanshare-storage
    environment:
      POSTGRES_APPLICATION_NAME: lanshare-agent-worker
      <<: *lanshare-timezone
      AGENT_TASK_WORKER_ID: agent-worker-compose
      # The Agents-SDK runtime runs in this container; platform tools go through
      # the app's /api/agent-bridge with a per-task credential (user's live authority).
      AGENT_BRIDGE_BASE_URL: http://app:8000
      AI_ASSISTANT_URL: http://ai:8001

  nginx:
    image: nginx:1.27-alpine
    cpu_shares: ${LANSHARE_NGINX_CPU_SHARES:-1024}
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 8192
        hard: 8192
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${LANSHARE_HTTP_PORT:-80}:80"
      - "${LANSHARE_HTTPS_PORT:-443}:443"
    volumes:
      - ./deployment/nginx-main.conf:/etc/nginx/nginx.conf:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tools/guardianangel.net.cn_nginx:/etc/nginx/ssl:ro
      - lanshare-static:/srv/lanshare/static:ro
    networks:
      - lanshare
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1/api/internal/live >/dev/null 2>&1 || exit 1
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  lanshare:
    driver: bridge

volumes:
  lanshare-static:
