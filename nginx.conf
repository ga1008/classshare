map $http_host $lq_proxy_host {
    default $http_host;
    '' $host;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' '';
}

map $uri $lq_log_path {
    ~^/materials/render-content/ /materials/render-content/redacted;
    default $uri;
}

log_format lq_timing '$remote_addr - [$time_iso8601] "$request_method $lq_log_path $server_protocol" '
    '$status $body_bytes_sent rt=$request_time uct=$upstream_connect_time '
    'uht=$upstream_header_time urt=$upstream_response_time req=$request_id';
# Public edge: replace untrusted forwarding chains with the observed peer.
proxy_set_header X-Request-ID $request_id;

upstream lanshare_app {
    server app:8000;
    keepalive 32;
    keepalive_timeout 20s;
}

# Upgrade on a fresh upstream connection. An old HTTP response may finish its
# ASGI body after Content-Length bytes were consumed; its keepalive timer must
# never retain ownership of a transport already upgraded to a live WebSocket.
upstream lanshare_realtime {
    server app:8000;
}

# HTTP → HTTPS 重定向
server {
    listen 80;
    server_name guardianangel.net.cn;
    # Override the image's inherited combined log instead of adding a second
    # http-level logger, which would also retain unredacted grant URLs.
    access_log /var/log/nginx/access.log lq_timing;

    # 健康检查走 HTTP 保持兼容
    location = /api/internal/live {
        proxy_pass http://lanshare_app;
        proxy_http_version 1.1;
        proxy_set_header Host $lq_proxy_host;
        proxy_set_header Connection "";
        proxy_set_header X-Request-ID $request_id;
    }

    location = /api/internal/health {
        proxy_pass http://lanshare_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Host $lq_proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 主服务
server {
    listen 443 ssl;
    server_name guardianangel.net.cn;
    access_log /var/log/nginx/access.log lq_timing;

    ssl_certificate     /etc/nginx/ssl/guardianangel.net.cn_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/guardianangel.net.cn.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS (可选，启用后浏览器强制 HTTPS 访问)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 256m;
    client_body_timeout 60s;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    # Only content-addressed application assets bypass FastAPI. Stable paths,
    # live media and manifests retain its ETag/no-cache policy. Old published
    # graphs remain available to examinations and editors opened before deploy.
    location ~ "^/static/(?:assets/[a-f0-9]{64}/(?:[A-Za-z0-9_.-]+/)*[A-Za-z0-9_.-]+|dist/assets/[A-Za-z0-9_.-]+-[A-Za-z0-9_-]{8,}\.[A-Za-z0-9]+)$" {
        root /srv/lanshare;
        try_files $uri @lanshare_static_fallback;
        gzip_static on;
        gzip_vary on;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Internal service endpoints are for containers on the compose network
    # (the AI worker calls app:8000 directly). Only the health/task probes
    # used by deployment postflight stay public; everything else, notably the
    # signed grading callback and runtime metrics, is not exposed.
    location = /api/internal/live {
        proxy_pass http://lanshare_app;
        proxy_http_version 1.1;
        proxy_set_header Host $lq_proxy_host;
        proxy_set_header Connection "";
        proxy_set_header X-Request-ID $request_id;
    }

    location = /api/internal/health {
        proxy_pass http://lanshare_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Host $lq_proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/internal/background-tasks {
        proxy_pass http://lanshare_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Host $lq_proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/internal/ {
        return 404;
    }

    location @lanshare_static_fallback {
        proxy_pass http://lanshare_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Host $lq_proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/ai/chat {
        proxy_pass http://lanshare_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Request-ID $request_id;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_set_header Host $lq_proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Configuration generation returns one JSON response after up to 180s of
    # upstream reasoning. Let the app return its own timeout/error response.
    location = /api/manage/ai/ai-generate {
        proxy_pass http://lanshare_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 210s;
        proxy_set_header Host $lq_proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://lanshare_realtime;
        proxy_http_version 1.1;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Host $lq_proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Student work uploads are capped by the app at MAX_SUBMISSION_TOTAL_MB
    # (10 MB). Reject oversized bodies here instead of buffering up to the
    # server-wide 256 MB first (audit B10); 20 MB leaves multipart headroom.
    # Raising MAX_SUBMISSION_TOTAL_MB in docker.env requires raising this too.
    location ~ "^/api/(assignments/[^/]+/(submit|draft|attachment-hash-check|submissions/offline)|submissions/[0-9]+/files)$" {
        client_max_body_size 20m;
        proxy_pass http://lanshare_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Host $lq_proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://lanshare_app;
        proxy_http_version 1.1;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Host $lq_proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
