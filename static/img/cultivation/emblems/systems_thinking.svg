<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img"><title>系统贯通</title><style>.spin{transform-box:view-box;transform-origin:32px 32px;animation:spin 24s linear infinite}
.spin-r{transform-box:view-box;transform-origin:32px 32px;animation:spin 18s linear infinite reverse}
.spin-f{transform-box:view-box;transform-origin:32px 32px;animation:spin 12s linear infinite}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.6s ease-in-out infinite}
.glint{animation:glint 2.4s ease-in-out infinite}
.flick{transform-box:fill-box;transform-origin:50% 100%;animation:flick 1.6s ease-in-out infinite}
.twinkle{transform-box:fill-box;transform-origin:center;animation:twinkle 1.8s ease-in-out infinite}
.sweep{animation:sweep 3.6s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes glint{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flick{0%,100%{transform:scale(1,1)}35%{transform:scale(.96,1.06)}70%{transform:scale(1.03,.95)}}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}
@keyframes sweep{0%{transform:translateX(-70px)}60%,100%{transform:translateX(70px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><radialGradient id="base" cx="50%" cy="40%" r="65%"><stop offset="0" stop-color="#26205e"/><stop offset="1" stop-color="#08071c"/></radialGradient><linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c7d2fe"/><stop offset="0.5" stop-color="#6366f1"/><stop offset="1" stop-color="#312e81"/></linearGradient><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><circle cx="32" cy="32" r="30" fill="url(#base)"/><circle cx="32" cy="32" r="28.5" fill="none" stroke="url(#rim)" stroke-width="3"/><circle cx="14" cy="22" r="0.9" fill="#e0e7ff" class="twinkle" style="animation-delay:0s"/><circle cx="49" cy="16" r="0.8" fill="#e0e7ff" class="twinkle" style="animation-delay:0.6s"/><circle cx="51" cy="45" r="1" fill="#e0e7ff" class="twinkle" style="animation-delay:1.1s"/><circle cx="17" cy="47" r="0.8" fill="#e0e7ff" class="twinkle" style="animation-delay:0.3s"/><circle cx="40" cy="54" r="0.7" fill="#e0e7ff" class="twinkle" style="animation-delay:0.9s"/><g class="spin"><g transform="rotate(0 32 32)"><ellipse cx="32" cy="32" rx="22" ry="8" fill="none" stroke="#818cf8" stroke-width="1.5"/><circle cx="54" cy="32" r="2.4" fill="#c7d2fe" filter="url(#glow)"/></g><g transform="rotate(60 32 32)"><ellipse cx="32" cy="32" rx="22" ry="8" fill="none" stroke="#818cf8" stroke-width="1.5"/><circle cx="54" cy="32" r="2.4" fill="#c7d2fe" filter="url(#glow)"/></g><g transform="rotate(120 32 32)"><ellipse cx="32" cy="32" rx="22" ry="8" fill="none" stroke="#818cf8" stroke-width="1.5"/><circle cx="54" cy="32" r="2.4" fill="#c7d2fe" filter="url(#glow)"/></g></g><path d="M32 21 Q33.4 30.6 43 32 Q33.4 33.4 32 43 Q30.6 33.4 21 32 Q30.6 30.6 32 21Z" fill="#eef2ff" filter="url(#glow)" class="pulse"/></svg>
