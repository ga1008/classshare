<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img"><title>可为人师</title><style>.spin{transform-box:view-box;transform-origin:32px 32px;animation:spin 24s linear infinite}
.spin-r{transform-box:view-box;transform-origin:32px 32px;animation:spin 18s linear infinite reverse}
.spin-f{transform-box:view-box;transform-origin:32px 32px;animation:spin 12s linear infinite}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.6s ease-in-out infinite}
.glint{animation:glint 2.4s ease-in-out infinite}
.flick{transform-box:fill-box;transform-origin:50% 100%;animation:flick 1.6s ease-in-out infinite}
.twinkle{transform-box:fill-box;transform-origin:center;animation:twinkle 1.8s ease-in-out infinite}
.sweep{animation:sweep 3.6s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes glint{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flick{0%,100%{transform:scale(1,1)}35%{transform:scale(.96,1.06)}70%{transform:scale(1.03,.95)}}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}
@keyframes sweep{0%{transform:translateX(-70px)}60%,100%{transform:translateX(70px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><radialGradient id="base" cx="50%" cy="40%" r="65%"><stop offset="0" stop-color="#3a2a06"/><stop offset="0.7" stop-color="#140d02"/><stop offset="1" stop-color="#000000"/></radialGradient><linearGradient id="aurora" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fde68a"/><stop offset="0.25" stop-color="#f9a8d4"/><stop offset="0.5" stop-color="#a5b4fc"/><stop offset="0.75" stop-color="#67e8f9"/><stop offset="1" stop-color="#fde68a"/></linearGradient><radialGradient id="sun" cx="45%" cy="40%" r="65%"><stop offset="0" stop-color="#fffdf5"/><stop offset="0.45" stop-color="#fde68a"/><stop offset="0.8" stop-color="#f59e0b"/><stop offset="1" stop-color="#92400e"/></radialGradient><linearGradient id="crown" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#fcd34d"/></linearGradient><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><circle cx="32" cy="32" r="31" fill="url(#base)"/><g class="spin"><line x1="32.00" y1="13.50" x2="32.00" y2="3.00" stroke="url(#aurora)" stroke-width="1.8" stroke-linecap="round"/><line x1="36.79" y1="14.13" x2="38.21" y2="8.82" stroke="url(#aurora)" stroke-width="1.8" stroke-linecap="round"/><line x1="41.25" y1="15.98" x2="46.50" y2="6.89" stroke="url(#aurora)" stroke-width="1.8" stroke-linecap="round"/><line x1="45.08" y1="18.92" x2="48.97" y2="15.03" stroke="url(#aurora)" stroke-width="1.8" stroke-linecap="round"/><line x1="48.02" y1="22.75" x2="57.11" y2="17.50" stroke="url(#aurora)" stroke-width="1.8" stroke-linecap="round"/><line x1="49.87" y1="27.21" x2="55.18" y2="25.79" stroke="url(#aurora)" stroke-width="1.8" stroke-linecap="round"/><line x1="50.50" y1="32.00" x2="61.00" y2="32.00" stroke="url(#aurora)" stroke-width="1.8" stroke-linecap="round"/><line x1=