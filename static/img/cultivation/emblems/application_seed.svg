<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img"><title>迁移初通</title><style>.spin{transform-box:view-box;transform-origin:32px 32px;animation:spin 24s linear infinite}
.spin-r{transform-box:view-box;transform-origin:32px 32px;animation:spin 18s linear infinite reverse}
.spin-f{transform-box:view-box;transform-origin:32px 32px;animation:spin 12s linear infinite}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.6s ease-in-out infinite}
.glint{animation:glint 2.4s ease-in-out infinite}
.flick{transform-box:fill-box;transform-origin:50% 100%;animation:flick 1.6s ease-in-out infinite}
.twinkle{transform-box:fill-box;transform-origin:center;animation:twinkle 1.8s ease-in-out infinite}
.sweep{animation:sweep 3.6s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes glint{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flick{0%,100%{transform:scale(1,1)}35%{transform:scale(.96,1.06)}70%{transform:scale(1.03,.95)}}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}
@keyframes sweep{0%{transform:translateX(-70px)}60%,100%{transform:translateX(70px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><radialGradient id="base" cx="50%" cy="40%" r="65%"><stop offset="0" stop-color="#0f4a33"/><stop offset="1" stop-color="#04160e"/></radialGradient><linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a7f3d0"/><stop offset="1" stop-color="#047857"/></linearGradient><radialGradient id="seed" cx="50%" cy="35%" r="65%"><stop offset="0" stop-color="#d1fae5"/><stop offset="0.55" stop-color="#34d399"/><stop offset="1" stop-color="#047857"/></radialGradient></defs><circle cx="32" cy="32" r="30" fill="url(#base)"/><circle cx="32" cy="32" r="28.5" fill="none" stroke="url(#rim)" stroke-width="3"/><g class="spin-f"><circle cx="32" cy="32" r="24" fill="none" stroke="#34d399" stroke-width="1.6" stroke-dasharray="3 4.2"/><circle cx="56.00" cy="32.00" r="2.1" fill="#d1fae5"/><circle cx="32.00" cy="56.00" r="2.1" fill="#d1fae5"/><circle cx="8.00" cy="32.00" r="2.1" fill="#d1fae5"/><circle cx="32.00" cy="8.00" r="2.1" fill="#d1fae5"/></g><path d="M32 27 C27 20 22 19 18.5 20.5 C20.5 26 26 28.5 32 27Z" fill="#6ee7b7"/><path d="M32 27 C37 20 42 19 45.5 20.5 C43.5 26 38 28.5 32 27Z" fill="#a7f3d0"/><ellipse cx="32" cy="36.5" rx="7.5" ry="9.5" fill="url(#seed)" class="pulse"/><path d="M29.5 32 Q31 30.5 33 31" fill="none" stroke="#ecfdf5" stroke-width="1.4" stroke-linecap="round"/></svg>
