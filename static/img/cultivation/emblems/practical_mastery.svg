<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img"><title>基本掌握</title><style>.spin{transform-box:view-box;transform-origin:32px 32px;animation:spin 24s linear infinite}
.spin-r{transform-box:view-box;transform-origin:32px 32px;animation:spin 18s linear infinite reverse}
.spin-f{transform-box:view-box;transform-origin:32px 32px;animation:spin 12s linear infinite}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.6s ease-in-out infinite}
.glint{animation:glint 2.4s ease-in-out infinite}
.flick{transform-box:fill-box;transform-origin:50% 100%;animation:flick 1.6s ease-in-out infinite}
.twinkle{transform-box:fill-box;transform-origin:center;animation:twinkle 1.8s ease-in-out infinite}
.sweep{animation:sweep 3.6s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes glint{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flick{0%,100%{transform:scale(1,1)}35%{transform:scale(.96,1.06)}70%{transform:scale(1.03,.95)}}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}
@keyframes sweep{0%{transform:translateX(-70px)}60%,100%{transform:translateX(70px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><radialGradient id="base" cx="50%" cy="40%" r="65%"><stop offset="0" stop-color="#5c1a06"/><stop offset="1" stop-color="#1a0702"/></radialGradient><linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fed7aa"/><stop offset="0.5" stop-color="#f97316"/><stop offset="1" stop-color="#9a3412"/></linearGradient><linearGradient id="flame" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fef08a"/><stop offset="0.45" stop-color="#fb923c"/><stop offset="1" stop-color="#dc2626"/></linearGradient><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><polygon points="43.86,3.36 60.64,20.14 60.64,43.86 43.86,60.64 20.14,60.64 3.36,43.86 3.36,20.14 20.14,3.36" fill="url(#base)" stroke="url(#rim)" stroke-width="3" stroke-linejoin="round"/><polygon points="41.76,8.44 55.56,22.24 55.56,41.76 41.76,55.56 22.24,55.56 8.44,41.76 8.44,22.24 22.24,8.44" fill="none" stroke="#fb923c" stroke-opacity=".4" stroke-width="1.2"/><path class="flick" filter="url(#glow)" d="M32 10 C38 18 44 23 42.5 33 C41.5 40.5 37 45 32 45 C27 45 22.5 40.5 21.5 33 C20.5 26 26 22.5 27.5 16 C29.5 21 30.5 22 32 23.5 C33.5 19.5 33.5 15 32 10Z" fill="url(#flame)"/><path d="M32 26 C35 30 36.5 33 35.5 37 C34.5 40 33 41 32 41 C31 41 29.5 40 28.5 37 C27.5 33 29 30 32 26Z" fill="#fff7ed" opacity=".9"/><line x1="15" y1="52" x2="49" y2="38" stroke="#fff7ed" stroke-width="2.6" stroke-linecap="round"/><line x1="49" y1="52" x2="15" y2="38" stroke="#fdba74" stroke-width="2.6" stroke-linecap="round"/><line x1="18.5" y1="47" x2="20.5" y2="51.5" stroke="#fff7ed" stroke-width="2.2" stroke-linecap="round"/><ellipse cx="14" cy="37.6" rx="2.6" ry="1.7" fill="#fdba74" transform="rotate(22 14 37.6)"/></svg>
