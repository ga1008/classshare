<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img"><title>核心筑基</title><style>.spin{transform-box:view-box;transform-origin:32px 32px;animation:spin 24s linear infinite}
.spin-r{transform-box:view-box;transform-origin:32px 32px;animation:spin 18s linear infinite reverse}
.spin-f{transform-box:view-box;transform-origin:32px 32px;animation:spin 12s linear infinite}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.6s ease-in-out infinite}
.glint{animation:glint 2.4s ease-in-out infinite}
.flick{transform-box:fill-box;transform-origin:50% 100%;animation:flick 1.6s ease-in-out infinite}
.twinkle{transform-box:fill-box;transform-origin:center;animation:twinkle 1.8s ease-in-out infinite}
.sweep{animation:sweep 3.6s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes glint{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flick{0%,100%{transform:scale(1,1)}35%{transform:scale(.96,1.06)}70%{transform:scale(1.03,.95)}}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}
@keyframes sweep{0%{transform:translateX(-70px)}60%,100%{transform:translateX(70px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><radialGradient id="base" cx="50%" cy="40%" r="65%"><stop offset="0" stop-color="#0f4c5c"/><stop offset="1" stop-color="#031a20"/></radialGradient><linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a5f3fc"/><stop offset="1" stop-color="#0e7490"/></linearGradient><linearGradient id="peak" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ecfeff"/><stop offset="1" stop-color="#67e8f9"/></linearGradient></defs><path d="M32 2.5 L57 11 V30 C57 45.5 46 55.5 32 61.5 C18 55.5 7 45.5 7 30 V11 Z" fill="url(#base)" stroke="url(#rim)" stroke-width="3" stroke-linejoin="round"/><path d="M32 8 L51 14.5 V30 C51 42 43 50 32 55 C21 50 13 42 13 30 V14.5 Z" fill="none" stroke="#22d3ee" stroke-opacity=".3" stroke-width="1.2"/><rect x="18" y="41" width="28" height="5.5" rx="1.2" fill="#0891b2"/><rect x="21.5" y="34" width="21" height="5.5" rx="1.2" fill="#22d3ee"/><rect x="25" y="27" width="14" height="5.5" rx="1.2" fill="#67e8f9"/><path d="M32 13 L39 25 H25 Z" fill="url(#peak)"/><circle cx="32" cy="12" r="2" fill="#ffffff" class="glint"/></svg>
