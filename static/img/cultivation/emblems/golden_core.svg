<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img"><title>融会小成</title><style>.spin{transform-box:view-box;transform-origin:32px 32px;animation:spin 24s linear infinite}
.spin-r{transform-box:view-box;transform-origin:32px 32px;animation:spin 18s linear infinite reverse}
.spin-f{transform-box:view-box;transform-origin:32px 32px;animation:spin 12s linear infinite}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.6s ease-in-out infinite}
.glint{animation:glint 2.4s ease-in-out infinite}
.flick{transform-box:fill-box;transform-origin:50% 100%;animation:flick 1.6s ease-in-out infinite}
.twinkle{transform-box:fill-box;transform-origin:center;animation:twinkle 1.8s ease-in-out infinite}
.sweep{animation:sweep 3.6s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes glint{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flick{0%,100%{transform:scale(1,1)}35%{transform:scale(.96,1.06)}70%{transform:scale(1.03,.95)}}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}
@keyframes sweep{0%{transform:translateX(-70px)}60%,100%{transform:translateX(70px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><radialGradient id="base" cx="50%" cy="40%" r="65%"><stop offset="0" stop-color="#5a2d07"/><stop offset="1" stop-color="#1f0e02"/></radialGradient><linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fde68a"/><stop offset="0.5" stop-color="#f59e0b"/><stop offset="1" stop-color="#b45309"/></linearGradient><radialGradient id="core" cx="42%" cy="38%" r="65%"><stop offset="0" stop-color="#fffbeb"/><stop offset="0.35" stop-color="#fde68a"/><stop offset="0.75" stop-color="#f59e0b"/><stop offset="1" stop-color="#b45309"/></radialGradient><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><polygon points="32.00,1.00 41.38,9.36 53.92,10.08 54.64,22.62 63.00,32.00 54.64,41.38 53.92,53.92 41.38,54.64 32.00,63.00 22.62,54.64 10.08,53.92 9.36,41.38 1.00,32.00 9.36,22.62 10.08,10.08 22.62,9.36" fill="url(#base)" stroke="url(#rim)" stroke-width="2.4" stroke-linejoin="round"/><circle cx="32" cy="32" r="21" fill="none" stroke="#fbbf24" stroke-opacity=".35" stroke-width="1.2"/><g class="spin-r" opacity=".9"><line x1="32.00" y1="16.50" x2="32.00" y2="12.00" stroke="#fcd34d" stroke-width="2" stroke-linecap="round"/><line x1="42.96" y1="21.04" x2="46.14" y2="17.86" stroke="#fcd34d" stroke-width="2" stroke-linecap="round"/><line x1="47.50" y1="32.00" x2="52.00" y2="32.00" stroke="#fcd34d" stroke-width="2" stroke-linecap="round"/><line x1="42.96" y1="42.96" x2="46.14" y2="46.14" stroke="#fcd34d" stroke-width="2" stroke-linecap="round"/><line x1="32.00" y1="47.50" x2="32.00" y2="52.00" stroke="#fcd34d" stroke-width="2" stroke-linecap="round"/><line x1="21.04" y1="42.96" x2="17.86" y2="46.14" stroke="#fcd34d" stroke-width="2" stroke-linecap="round"/><line x1="16.50" y1="32.00" x2="12.00" y2="32.00" stroke="#fcd34d" stroke-width="2" stroke-linecap="round"/><line x1="21.04" y1="21.04" x2="17.86" y2="17.86" stroke="#fcd34d" stroke-width="2" stroke-linecap="round"/></g><circle cx="32" cy="32" r="16" fill="none" stroke="#fde68a" stroke-width="1.4" class="glint"/><circle cx="32" cy="32" r="12" fill="url(#core)" filter="url(#glow)" class="pulse"/><ellipse cx="28" cy="27.5" rx="4" ry="2.4" fill="#ffffff" opacity=".75"/></svg>
