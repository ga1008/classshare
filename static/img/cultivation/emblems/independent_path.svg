<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img"><title>自主精进</title><style>.spin{transform-box:view-box;transform-origin:32px 32px;animation:spin 24s linear infinite}
.spin-r{transform-box:view-box;transform-origin:32px 32px;animation:spin 18s linear infinite reverse}
.spin-f{transform-box:view-box;transform-origin:32px 32px;animation:spin 12s linear infinite}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.6s ease-in-out infinite}
.glint{animation:glint 2.4s ease-in-out infinite}
.flick{transform-box:fill-box;transform-origin:50% 100%;animation:flick 1.6s ease-in-out infinite}
.twinkle{transform-box:fill-box;transform-origin:center;animation:twinkle 1.8s ease-in-out infinite}
.sweep{animation:sweep 3.6s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes glint{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flick{0%,100%{transform:scale(1,1)}35%{transform:scale(.96,1.06)}70%{transform:scale(1.03,.95)}}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}
@keyframes sweep{0%{transform:translateX(-70px)}60%,100%{transform:translateX(70px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><radialGradient id="base" cx="50%" cy="40%" r="65%"><stop offset="0" stop-color="#5c0a22"/><stop offset="1" stop-color="#19020a"/></radialGradient><linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fef3c7"/><stop offset="0.45" stop-color="#fb7185"/><stop offset="1" stop-color="#9f1239"/></linearGradient><linearGradient id="wing" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fde68a"/><stop offset="0.5" stop-color="#fb7185"/><stop offset="1" stop-color="#be123c"/></linearGradient><linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff1f2"/><stop offset="1" stop-color="#f43f5e"/></linearGradient><linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".65"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient><clipPath id="disc"><circle cx="32" cy="32" r="28"/></clipPath><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><circle cx="32" cy="32" r="30" fill="url(#base)"/><g class="spin" opacity=".45"><line x1="32.00" y1="23.00" x2="32.00" y2="4.00" stroke="#fb7185" stroke-width="1.2" stroke-linecap="round"/><line x1="35.44" y1="23.69" x2="40.42" y2="11.67" stroke="#fb7185" stroke-width="1.2" stroke-linecap="round"/><line x1="38.36" y1="25.64" x2="51.80" y2="12.20" stroke="#fb7185" stroke-width="1.2" stroke-linecap="round"/><line x1="40.31" y1="28.56" x2="52.33" y2="23.58" stroke="#fb7185" stroke-width="1.2" stroke-linecap="round"/><line x1="41.00" y1="32.00" x2="60.00" y2="32.00" stroke="#fb7185" stroke-width="1.2" stroke-linecap="round"/><line x1="40.31" y1="35.44" x2="52.33" y2="40.42" stroke="#fb7185" stroke-width="1.2" stroke-linecap="round"/><line x1="38.36" y1="38.36" x2="51.80" y2="51.80" stroke="#fb7185" stroke-width="1.2" stroke-linecap="round"/><line x1="35.44" y1="40.31" x2="40.42" y2="52.33" stroke="#fb7185" stroke-width="1.2" stroke-linecap="round"/><line x1="32.00" y1="41.00" x2="32.00" y2="60.00" stroke="#fb7185" stroke-width="1.2" stroke-linecap="round"/><line x1="28.56" y1="40.31" x2="23.58" y2="52.33" stroke="#fb7185" stroke-width="1.2" stroke-linecap="round"/><line x1="25.64" y1="38.36" x2="12.20" y2="51.80" stroke="#fb7185" stroke-width="1.2" stroke-linecap="round"/><line x1="23.69" y1="35.44" x2="11.67" y2="40.42" stroke="#fb7185" stroke-width="1.2" stroke-linecap="round"/><line x1="23.00" y1="32.00" x2="4.00" y2="32.00" stroke="#fb7185" stroke-width="1.2" stroke-linecap="round"/><line x1="23.69" y1="28.56" x2="11.67" y2="23.58" stroke="#fb7185" stroke-width="1.2" stroke-linecap="round"/><line x1="25.64" y1="25.64" x2="12.20" y2="12.20" stroke="#fb7185" stroke-width="1.2" stroke-linecap="round"/><line x1="28.56" y1="23.69" x2="23.58" y2="11.67" stroke="#fb7185" stroke-width="1.2" stroke-linecap="round"/></g><circle cx="32" cy="32" r="28.5" fill="none" stroke="url(#rim)" stroke-width="3"/><path d="M32 35 C26 27 16 22.5 5.5 24.5 C11.5 28 14 31.5 19.5 33 C13.5 34.2 10.5 37.5 8.5 41.5 C16.5 40.5 24 38.6 32 39Z" fill="url(#wing)"/><path d="M32 35 C26 27 16 22.5 5.5 24.5 C11.5 28 14 31.5 19.5 33 C13.5 34.2 10.5 37.5 8.5 41.5 C16.5 40.5 24 38.6 32 39Z" fill="url(#wing)" transform="translate(64 0) scale(-1 1)"/><path d="M32 21 C35.5 25.5 35.5 34 32 44 C28.5 34 28.5 25.5 32 21Z" fill="url(#body)" filter="url(#glow)"/><path d="M32 44 C29 48 26 50 23 51 M32 44 C32 48.5 32 51 32 54 M32 44 C35 48 38 50 41 51" fill="none" stroke="#fda4af" stroke-width="1.8" stroke-linecap="round"/><polygon points="32.00,7.90 33.12,10.96 36.37,11.08 33.81,13.09 34.70,16.22 32.00,14.40 29.30,16.22 30.19,13.09 27.63,11.08 30.88,10.96" fill="#fef3c7" filter="url(#glow)" class="pulse"/><g clip-path="url(#disc)"><g transform="rotate(25 32 32)"><rect x="12" y="-8" width="16" height="80" fill="url(#shine)" class="sweep"/></g></g></svg>
