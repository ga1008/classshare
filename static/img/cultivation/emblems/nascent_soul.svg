<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img"><title>完全掌握</title><style>.spin{transform-box:view-box;transform-origin:32px 32px;animation:spin 24s linear infinite}
.spin-r{transform-box:view-box;transform-origin:32px 32px;animation:spin 18s linear infinite reverse}
.spin-f{transform-box:view-box;transform-origin:32px 32px;animation:spin 12s linear infinite}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.6s ease-in-out infinite}
.glint{animation:glint 2.4s ease-in-out infinite}
.flick{transform-box:fill-box;transform-origin:50% 100%;animation:flick 1.6s ease-in-out infinite}
.twinkle{transform-box:fill-box;transform-origin:center;animation:twinkle 1.8s ease-in-out infinite}
.sweep{animation:sweep 3.6s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes glint{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flick{0%,100%{transform:scale(1,1)}35%{transform:scale(.96,1.06)}70%{transform:scale(1.03,.95)}}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}
@keyframes sweep{0%{transform:translateX(-70px)}60%,100%{transform:translateX(70px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><radialGradient id="base" cx="50%" cy="40%" r="65%"><stop offset="0" stop-color="#3b1278"/><stop offset="1" stop-color="#10042a"/></radialGradient><linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5d0fe"/><stop offset="0.5" stop-color="#a855f7"/><stop offset="1" stop-color="#5b21b6"/></linearGradient><linearGradient id="petal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fae8ff"/><stop offset="1" stop-color="#a855f7"/></linearGradient><radialGradient id="soul" cx="50%" cy="65%" r="65%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.6" stop-color="#f5d0fe"/><stop offset="1" stop-color="#c084fc"/></radialGradient><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><circle cx="32" cy="32" r="30" fill="url(#base)"/><circle cx="32" cy="32" r="28.5" fill="none" stroke="url(#rim)" stroke-width="3"/><g class="spin"><circle cx="32" cy="32" r="25" fill="none" stroke="#e9d5ff" stroke-width="2" stroke-dasharray="1 3.2"/></g><g class="spin-r"><circle cx="32" cy="32" r="21.5" fill="none" stroke="#c084fc" stroke-opacity=".6" stroke-width="1" stroke-dasharray="10 6"/></g><path d="M32 46 C27 38 28 30 32 24 C36 30 37 38 32 46Z" fill="url(#petal)" transform="rotate(-58 32 46)" opacity=".7"/><path d="M32 46 C27 38 28 30 32 24 C36 30 37 38 32 46Z" fill="url(#petal)" transform="rotate(58 32 46)" opacity=".7"/><path d="M32 46 C27 38 28 30 32 24 C36 30 37 38 32 46Z" fill="url(#petal)" transform="rotate(-29 32 46)" opacity=".88"/><path d="M32 46 C27 38 28 30 32 24 C36 30 37 38 32 46Z" fill="url(#petal)" transform="rotate(29 32 46)" opacity=".88"/><path d="M32 46 C27 38 28 30 32 24 C36 30 37 38 32 46Z" fill="url(#petal)" transform="rotate(0 32 46)" opacity="1"/><path class="flick" filter="url(#glow)" d="M32 11 C35.5 16.5 38 20 38 23.5 A6 6 0 0 1 26 23.5 C26 20 28.5 16.5 32 11Z" fill="url(#soul)"/><circle cx="32" cy="23" r="1.8" fill="#7e22ce"/></svg>
